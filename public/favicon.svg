<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bf216" />
      <stop offset="60%" stop-color="#7acc00" />
      <stop offset="100%" stop-color="#5fa300" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7acc00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Crisp Clean White Background Squircle for App Icon -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />

  <!-- Bold Zoomed Green Plate (radius 215 = 430px diameter, fills 84% of icon!) -->
  <circle cx="256" cy="256" r="215" fill="url(#plateGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="10 10" />

  <!-- Scaled Up Crisp White Fork (Left) -->
  <path d="M 188 128 L 188 222 M 215 115 L 215 222 M 242 128 L 242 222" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <path d="M 174 222 C 174 270 256 270 256 222" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 215 264 L 215 385" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

  <!-- Scaled Up Crisp White Knife with Leaf Blade (Right) -->
  <path d="M 297 115 C 345 155 345 250 297 275 L 297 385" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 297 122 C 338 155 338 245 297 268 Z" fill="#ffffff" />

  <!-- Elegant Leaf Sprout in Negative Space (Bottom Center) -->
  <path d="M 256 325 C 282 340 276 362 256 375 C 236 362 230 340 256 325 Z" fill="#ffffff" />
</svg>