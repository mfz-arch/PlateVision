
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d" />
      <stop offset="50%" stop-color="#0f1217" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Neon Lime to Emerald Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff5e" />
      <stop offset="40%" stop-color="#b6ff2e" />
      <stop offset="100%" stop-color="#00e599" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="plateInnerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#1a1e27" />
      <stop offset="100%" stop-color="#11141a" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container (App Icon Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="110" fill="none" stroke="url(#limeGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Plate Rim with Glow -->
  <circle cx="256" cy="256" r="176" fill="url(#plateInnerGrad)" stroke="url(#limeGrad)" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08" stroke-dasharray="6 8" />

  <!-- AI Computer Vision Scanner Brackets (4 Corners) -->
  <!-- Top-Left Bracket -->
  <path d="M 148 200 L 148 160 Q 148 148 160 148 L 200 148" fill="none" stroke="url(#limeGrad)" stroke-width="9" stroke-linecap="round" />
  <!-- Top-Right Bracket -->
  <path d="M 312 148 L 352 148 Q 364 148 364 160 L 364 200" fill="none" stroke="url(#limeGrad)" stroke-width="9" stroke-linecap="round" />
  <!-- Bottom-Left Bracket -->
  <path d="M 148 312 L 148 352 Q 148 364 160 364 L 200 364" fill="none" stroke="url(#limeGrad)" stroke-width="9" stroke-linecap="round" />
  <!-- Bottom-Right Bracket -->
  <path d="M 312 364 L 352 364 Q 364 364 364 352 L 364 312" fill="none" stroke="url(#limeGrad)" stroke-width="9" stroke-linecap="round" />

  <!-- Center Nutrition & Vision Icon: Modern Camera Aperture + Nutrition Leaf Energy Spark -->
  <!-- Center Camera / Macro Lens Body -->
  <circle cx="256" cy="256" r="54" fill="#14171d" stroke="url(#limeGrad)" stroke-width="6" />

  <!-- Stylized Nutrition Leaf / Spark inside the lens -->
  <path d="M 256 220 Q 288 232 288 256 Q 288 280 256 292 Q 224 280 224 256 Q 224 232 256 220 Z" fill="url(#limeGrad)" />
  <circle cx="256" cy="256" r="10" fill="#14171d" />

  <!-- Pulsing AI Target Nodes -->
  <circle cx="256" cy="116" r="6" fill="#b6ff2e" />
  <circle cx="396" cy="256" r="6" fill="#b6ff2e" />
  <circle cx="256" cy="396" r="6" fill="#b6ff2e" />
  <circle cx="116" cy="256" r="6" fill="#b6ff2e" />
</svg>
